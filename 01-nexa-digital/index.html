<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexa Digital - Soluções que impulsionam o seu negócio</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- IMPORTANTE: Script para carregar os ícones minimalistas (Lucide Icons) -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <!-- [CABEÇALHO] - Contém o logo e o menu de navegação -->
    <header class="main-header">
        <div class="container header-container">
            <!-- Logo e Nome da Empresa -->
            <div class="logo">
                <!-- Ícone da Esfera de Rede em SVG Minimalista -->
                <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="12" cy="12" r="10" />
                    <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20" />
                    <path d="M2 12h20" />
                </svg>
                <span class="logo-text">Nexa Digital</span>
            </div>
            <!-- Menu de Navegação -->
            <nav class="main-nav">
                <ul>
                    <li><a href="#servicos">Serviços</a></li>
                    <li><a href="#sobre">Sobre</a></li>
                    <li><a href="#contato">Contato</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- [SEÇÃO HERO] - A primeira seção visual, com a chamada principal e a imagem de destaque -->
    <section class="hero-section">
        <div class="container hero-container">
            <div class="hero-content">
                <h1>Soluções que impulsionam o seu negócio</h1>
                <p>Ajudamos empresas a crescerem no digital com estratégias eficientes e resultados reais.</p>
                <a href="#servicos" class="btn-primary">Conheça nossos serviços</a>
            </div>
            <div class="hero-image-wrapper">
                <div class="abstract-shape"></div>
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR1g3E0KmKu71BXCnapJpOjV0WqGDwocgRkvI-7Zdq5GA&s=10 " alt="Ilustração 3D de gráfico de crescimento" class="hero-3d-image">
                <div class="abstract-sphere"></div>
            </div>
        </div>
    </section>
